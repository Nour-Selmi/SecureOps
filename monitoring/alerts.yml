groups:
  - name: secureops-alerts
    rules:
      - alert: AppDown
        expr: up{job="secureops"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "L'application est injoignable"

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"4..|5.."}[1m])) > 0.2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs HTTP élevé"

      - alert: HighHeapUsage
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire heap JVM supérieure à 85 %"